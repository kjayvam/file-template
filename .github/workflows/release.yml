name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Rust 도구 설치
        run: rustup show
      - name: 프론트엔드 의존성 설치
        working-directory: frontend
        run: npm ci
      - name: 포맷, 테스트 및 빌드
        run: ./scripts/check.sh
      - name: 배포
        run: ./scripts/deploy.sh
