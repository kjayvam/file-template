name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    # GitHub Release를 만들거나 패키지를 올리는 단계를 추가할 때만 필요한 권한(contents: write 등)을 이 job에 엽니다.
    steps:
      - uses: actions/checkout@v6
      - name: 배포
        run: ./scripts/deploy.sh
