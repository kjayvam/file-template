version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # 잠금 파일(Cargo.lock, package-lock.json)은 Dependabot PR에서 갱신되고 CI는 --locked·npm ci로 검증합니다.
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # @types/node는 실행 Node와 같은 22 계열을 유지합니다. (engines, Docker 이미지와 함께 올립니다)
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # 서로의 peer 범위가 맞아야 npm ci가 통과하는 패키지는 한 PR로 묶습니다.
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/plugin-react"]
  # Rust 이미지 갱신 PR은 rust-toolchain.toml도 같은 버전으로 올려야 check.sh를 통과합니다.
  - package-ecosystem: "docker"
    directories: ["/backend", "/frontend"]
    schedule:
      interval: "weekly"
    # Node는 package.json engines(>=22.22.2 <23)와 같은 22 계열을 유지합니다.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # PostgreSQL major 갱신은 기존 pg-data 볼륨을 그대로 읽지 못하므로(pg_upgrade·덤프 복원 필요) 수동으로 올립니다.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
