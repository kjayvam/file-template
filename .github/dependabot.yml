version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # 잠금 파일(Cargo.lock, package-lock.json)은 Dependabot PR에서 갱신되고 CI는 --locked·npm ci로 검증합니다.
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
  # Rust 이미지 갱신 PR은 rust-toolchain.toml도 같은 버전으로 올려야 check.sh를 통과합니다.
  - package-ecosystem: "docker"
    directories: ["/backend", "/frontend"]
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
