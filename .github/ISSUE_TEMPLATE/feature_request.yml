name: 기능 제안
description: 새로운 기능이나 개선 아이디어를 제안해 주세요
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
    validations:
      required: true
  - type: textarea
