services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-sqlite:///app/data/app.db}
    ports:
      - "8080:8080"
    volumes:
      # SQLite 사용 시 파일 저장 및 앱 데이터 보존 볼륨
      - app-data:/app/data

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # [선택] 서버형 데이터베이스가 필요할 때만 `--profile postgres`로 함께 실행합니다.
  # 프로덕션에서는 호스트에 DB 포트를 열지 않고 Compose 네트워크(db:5432)로만 접속합니다.
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-my_project}
      POSTGRES_USER: ${DATABASE_USER:-my_project}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-my_project}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  app-data:
  pg-data:
