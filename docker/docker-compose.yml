services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-sqlite:///app/data/app.db}
    # 호스트 포트를 열지 않습니다. 외부 요청은 frontend Nginx의 /api/ 프록시(backend:8080)로만 들어옵니다.
    volumes:
      # SQLite 사용 시 파일 저장 및 앱 데이터 보존 볼륨
      - app-data:/app/data

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # [선택] 서버형 데이터베이스가 필요할 때만 `--profile postgres`로 함께 실행합니다.
  # 프로덕션에서는 호스트에 DB 포트를 열지 않고 Compose 네트워크(db:5432)로만 접속합니다.
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-my_project}
      POSTGRES_USER: ${DATABASE_USER:-my_project}
      # 기본 비밀번호를 두지 않습니다. .env에 DATABASE_PASSWORD가 없으면 PostgreSQL이 초기화를 거부합니다.
      # (`:?`로 필수 지정하면 postgres 프로필을 쓰지 않는 SQLite 실행까지 실패하므로 빈 값을 기본으로 둡니다)
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-my_project}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  app-data:
  pg-data:
