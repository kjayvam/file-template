# conf.d 파일은 http 블록 안에 포함되므로 map을 여기서 정의할 수 있습니다.
# WebSocket 요청에만 Connection: upgrade를 보내고, 일반 요청은 Connection 헤더를 비워 보냅니다.
# 백엔드 연결 재사용(keep-alive)까지 하려면 upstream 블록에 keepalive를 추가하고 proxy_pass가 그 upstream을 가리키게 합니다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    # root가 아닌 nginx-unprivileged 이미지이므로 8080에서 받고, 프로덕션 Compose가 호스트 80을 연결합니다.
    listen 8080;
    server_name localhost;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;

    # 기본 보안 헤더. location에서 add_header를 쓰면 server 단계 값이 상속되지 않으므로 그 location에도 같은 줄을 둡니다.
    # CSP·HSTS는 프로젝트의 스크립트 출처와 HTTPS 종단 위치에 맞춰 직접 추가합니다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite가 해시를 붙여 만든 정적 파일은 길게 캐시합니다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # React 정적 파일 서빙. SPA 경로는 index.html로 돌려보내고 index.html은 매번 재검증합니다.
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # API 리버스 프록시 -> Rust 백엔드
    # proxy_pass 뒤에 URI(/)를 붙이면 /api/ 접두사가 잘려 백엔드 라우트(/api/v1/...)와 어긋납니다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
