# conf.d 파일은 http 블록 안에 포함되므로 map을 여기서 정의할 수 있습니다.
# WebSocket 요청에만 Connection: upgrade를 보내고, 일반 요청은 keep-alive를 유지합니다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;

    # Vite가 해시를 붙여 만든 정적 파일은 길게 캐시합니다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React 정적 파일 서빙. SPA 경로는 index.html로 돌려보내고 index.html은 매번 재검증합니다.
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API 리버스 프록시 -> Rust 백엔드
    # proxy_pass 뒤에 URI(/)를 붙이면 /api/ 접두사가 잘려 백엔드 라우트(/api/v1/...)와 어긋납니다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
