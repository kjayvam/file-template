services:
  backend:
    image: rust:1.99.1-alpine
    working_dir: /app
    # Rust 코드를 바꾸면 `docker compose ... restart backend`로 다시 컴파일·실행합니다.
    command: sh -c "apk add --no-cache musl-dev && cargo run"
    volumes:
      - ../backend:/app
      - cargo-cache:/usr/local/cargo/registry
      # 컨테이너용 빌드 산출물을 호스트의 backend/target과 분리합니다.
      - backend-target:/app/target
      # SQLite 사용 시 파일 저장 및 앱 데이터 보존 볼륨
      - app-data:/app/data
    env_file: ../.env
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-sqlite:///app/data/app.db}
    ports:
      - "8080:8080"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BACKEND_URL: http://backend:8080
    depends_on:
      - backend

  # [선택] 서버형 데이터베이스가 필요할 때만 `--profile postgres`로 함께 실행합니다.
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-my_project}
      POSTGRES_USER: ${DATABASE_USER:-my_project}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-my_project}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  app-data:
  pg-data:
  cargo-cache:
  backend-target:
